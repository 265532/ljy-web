
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathOptix - Route Optimization</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #05080F;
        color: #E2E8F0;
        margin: 0;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0B0F19;
      }
      ::-webkit-scrollbar-thumb {
        background: #1F2937;
        border-radius: 10px;
      }
      .glow-cyan {
        box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
      }
      .path-glow {
        filter: drop-shadow(0 0 4px rgba(6, 182, 212, 0.8));
      }
      .glass-card {
          background: rgba(28, 33, 39, 0.7);
          backdrop-filter: blur(12px);
          border: 1px solid rgba(59, 71, 84, 0.5);
      }
      .glow-button:hover {
          box-shadow: 0 0 20px rgba(19, 127, 236, 0.4);
      }
      .network-gradient {
          background: radial-gradient(circle at center, #137fec1a 0%, transparent 70%);
      }
      
      /* 打印样式 */
      @media print {
        /* 隐藏不需要打印的元素 */
        .no-print {
          display: none !important;
        }
        
        /* 确保打印内容占满页面 */
        body {
          background: white !important;
          color: black !important;
        }
        
        /* 调整打印内容的样式 */
        .print-container {
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 20px !important;
          background: white !important;
          color: black !important;
        }
        
        /* 调整表格样式 */
        table {
          width: 100% !important;
          border-collapse: collapse !important;
        }
        
        /* 调整字体大小 */
        h1, h2, h3, h4, h5, h6 {
          color: black !important;
        }
        
        /* 调整边框和背景 */
        div {
          border-color: black !important;
          background: white !important;
          color: black !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",

    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

</body>
</html>
